<svg xmlns="http://www.w3.org/2000/svg" width="1550" height="880" viewBox="0 0 1550 880" role="img" aria-labelledby="title description"><title id="title">InputForge runtime architecture</title><desc id="description">The GUI forwards user events to app callbacks. The app sends validated commands to the core and samples shared state to prepare frames for GUI signal publication.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="none" stroke="#64748b" stroke-width="1.7"/></marker></defs><rect width="1550" height="880" fill="#f7f9fc"/><style>text{font-family:DejaVu Sans,sans-serif;fill:#17253c}.title{font-size:34px;font-weight:700}.sub{font-size:18px;fill:#58677e}.name{font-size:29px;font-weight:700}.crate{font-family:DejaVu Sans Mono,monospace;font-size:16px;fill:#58677e}.body{font-size:20px}.label{font-size:19px;font-weight:600;fill:#41516a}.small{font-size:17px;fill:#58677e}.tag{font-size:16px;font-weight:700;letter-spacing:1px}</style><text x="64" y="64" class="title">InputForge after the rendering refactor</text><text x="64" y="98" class="sub">Runtime flow · the app coordinates the editor; the core executes domain changes</text><path d="M280 220 V172 H775 V220" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M815 220 V172 H1270 V220" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#arrow)"/><text x="520" y="142" class="label" text-anchor="middle">Observed events → app callbacks</text><text x="1040" y="142" class="label" text-anchor="middle">Validated commands → queue</text><rect x="70" y="220" width="420" height="290" rx="18" fill="#eaf1ff" stroke="#6488df" stroke-width="1.6"/><text x="97" y="267" class="name">GUI</text><text x="97" y="296" class="crate">inputforge-gui-dx</text><text x="97" y="345" class="body">Render components and CSS</text><text x="97" y="380" class="body">Display prepared state and values</text><text x="97" y="415" class="body">Forward events to callbacks</text><text x="97" y="450" class="body">Publish changed Dioxus signals</text><rect x="565" y="220" width="420" height="290" rx="18" fill="#e5f5f1" stroke="#36987e" stroke-width="1.6"/><text x="592" y="267" class="name">APP</text><text x="592" y="296" class="crate">inputforge-app</text><text x="592" y="345" class="body">Interpret events and workflows</text><text x="592" y="380" class="body">Drafts, validation and undo/redo</text><text x="592" y="415" class="body">Own capture and listener lifetime</text><text x="592" y="450" class="body">Prepare frames and native services</text><rect x="1060" y="220" width="420" height="290" rx="18" fill="#fff1df" stroke="#c28b3a" stroke-width="1.6"/><text x="1087" y="267" class="name">CORE</text><text x="1087" y="296" class="crate">inputforge-core</text><text x="1087" y="345" class="body">Execute commands and guards</text><text x="1087" y="380" class="body">Process inputs and route outputs</text><text x="1087" y="415" class="body">Persist profiles and settings</text><text x="1087" y="450" class="body">Create snapshots and recover</text><path d="M1270 510 V558 H815 V510" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M775 510 V558 H280 V510" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#arrow)"/><text x="1040" y="595" class="label" text-anchor="middle">Shared AppState</text><text x="1040" y="622" class="small" text-anchor="middle">state · acknowledgements · warnings</text><text x="520" y="595" class="label" text-anchor="middle">Prepared Frame → Publisher</text><text x="520" y="622" class="small" text-anchor="middle">immediate + 16 ms · changed signals only</text><text x="80" y="687" class="tag">RENDERING</text><text x="80" y="720" class="small">DOM references, plot geometry,</text><text x="80" y="745" class="small">menu placement and visual formatting</text><text x="575" y="687" class="tag">NATIVE SERVICES</text><text x="575" y="720" class="small">Desktop lifecycle, file pickers,</text><text x="575" y="745" class="small">Wayland clipboard and app transports</text><text x="1070" y="687" class="tag">ENGINE SERVICES</text><text x="1070" y="720" class="small">Device input and virtual output,</text><text x="1070" y="745" class="small">filesystem persistence and recovery</text><rect x="65" y="790" width="1420" height="55" rx="12" fill="#e9edf4"/><text x="775" y="824" class="label" text-anchor="middle">UI-only actions stay in app callbacks. A queued command is not yet a successful save.</text></svg>