name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DIOXUS_CLI_VERSION: 0.7.9

jobs:
  test:
    name: Test release gate
    runs-on: windows-2025-vs2026
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          lfs: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate release tag
        id: version
        shell: pwsh
        run: .github/scripts/validate-release-tag.ps1 -TagRef "${{ github.ref }}" -ManifestPath Cargo.toml

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: windows-release-test
          cache-targets: true
          cache-all-crates: true
          cache-bin: false

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Run workspace tests
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
          RUSTFLAGS: "-C debuginfo=0 -C codegen-units=16"
        run: cargo test --workspace --locked

      - name: Show sccache stats
        if: ${{ !cancelled() }}
        run: sccache --show-stats

  build:
    name: Bundle ${{ matrix.platform }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025-vs2026
            platform: windows
            package_type: nsis
            asset_glob: target/dx/*/bundle/windows/nsis/*.exe
    env:
      HAS_WINDOWS_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          lfs: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: windows-release-build-dioxus-${{ env.DIOXUS_CLI_VERSION }}
          cache-targets: true
          cache-all-crates: true
          cache-bin: true

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Resolve Cargo tools
        id: cargo_tools
        shell: pwsh
        run: |
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE ".cargo" }
          $cargoBin = Join-Path $cargoHome "bin"
          $dx = Join-Path $cargoBin "dx.exe"
          $binstall = Join-Path $cargoBin "cargo-binstall.exe"

          "dx_path=$dx" >> $env:GITHUB_OUTPUT

          $dxCacheHit = "false"
          if (Test-Path -LiteralPath $dx) {
            $dxVersionOutput = (& $dx --version 2>$null | Out-String).Trim()
            $dxVersionExitCode = $LASTEXITCODE
            $dxVersionMatch = [regex]::Match($dxVersionOutput, "(?<version>\d+\.\d+\.\d+(?:[-+][^\s]+)?)")
            if (($dxVersionExitCode -eq 0) -and $dxVersionMatch.Success -and ($dxVersionMatch.Groups["version"].Value -eq $env:DIOXUS_CLI_VERSION)) {
              $dxCacheHit = "true"
            }
          }

          $binstallMissing = if (Test-Path -LiteralPath $binstall) { "false" } else { "true" }

          "dx_cache_hit=$dxCacheHit" >> $env:GITHUB_OUTPUT
          "binstall_missing=$binstallMissing" >> $env:GITHUB_OUTPUT

      - name: Install cargo-binstall
        if: ${{ steps.cargo_tools.outputs.dx_cache_hit != 'true' && steps.cargo_tools.outputs.binstall_missing == 'true' }}
        uses: cargo-bins/cargo-binstall@v1.19.1

      - name: Install Dioxus CLI
        if: ${{ steps.cargo_tools.outputs.dx_cache_hit != 'true' }}
        shell: pwsh
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
        run: |
          cargo binstall --force --no-confirm --locked "dioxus-cli@${{ env.DIOXUS_CLI_VERSION }}"
          if ($LASTEXITCODE -eq 0) {
            exit 0
          }

          cargo install dioxus-cli --version "${{ env.DIOXUS_CLI_VERSION }}" --locked --force

      - name: Verify Dioxus CLI
        shell: pwsh
        run: |
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE ".cargo" }
          $dx = Join-Path $cargoHome "bin\dx.exe"

          if (-not (Test-Path -LiteralPath $dx)) {
            throw "Dioxus CLI was not installed at '$dx'."
          }

          $dxVersionOutput = (& $dx --version | Out-String).Trim()
          $dxVersionExitCode = $LASTEXITCODE
          if ($dxVersionExitCode -ne 0) {
            throw "Dioxus CLI version check failed with exit code $dxVersionExitCode."
          }

          $dxVersionMatch = [regex]::Match($dxVersionOutput, "(?<version>\d+\.\d+\.\d+(?:[-+][^\s]+)?)")
          if (-not $dxVersionMatch.Success) {
            throw "Dioxus CLI version output did not contain a SemVer token: '$dxVersionOutput'."
          }

          $dxVersion = $dxVersionMatch.Groups["version"].Value
          if ($dxVersion -ne $env:DIOXUS_CLI_VERSION) {
            throw "Dioxus CLI version '$dxVersion' did not match expected '$env:DIOXUS_CLI_VERSION'. Full output: $dxVersionOutput"
          }

          $dxVersionOutput
          "DX_BIN=$dx" >> $env:GITHUB_ENV

      - name: Verify SDL runtime source
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "SDL/SDL3.dll")) {
            throw "SDL/SDL3.dll is required for Windows release bundles."
          }

      - name: Bundle desktop app
        shell: pwsh
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
        run: |
          & $env:DX_BIN bundle --package inputforge-app --bin inputforge --platform "${{ matrix.platform }}" --release --package-types "${{ matrix.package_type }}" --locked

      - name: Show sccache stats
        if: ${{ !cancelled() }}
        run: sccache --show-stats

      - name: Locate installer
        id: installer
        shell: pwsh
        run: |
          $matches = @(Get-ChildItem -Path "${{ matrix.asset_glob }}" -File | Sort-Object FullName)

          if ($matches.Count -ne 1) {
            $found = $matches | ForEach-Object { $_.FullName } | Out-String
            throw "Expected exactly one installer matching '${{ matrix.asset_glob }}', found $($matches.Count): $found"
          }

          $installer = $matches[0]
          "installer_path=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "installer_name=$($installer.Name)" >> $env:GITHUB_OUTPUT

      - name: Rename installer asset
        id: release_installer
        shell: pwsh
        env:
          INSTALLER_PATH: ${{ steps.installer.outputs.installer_path }}
          RELEASE_VERSION: ${{ needs.test.outputs.release_version }}
        run: |
          $installer = Get-Item -LiteralPath $env:INSTALLER_PATH
          $targetName = "inputforge_{0}_x64-setup.exe" -f $env:RELEASE_VERSION
          $targetPath = Join-Path $installer.DirectoryName $targetName

          if ($installer.FullName -ne $targetPath) {
            Move-Item -LiteralPath $installer.FullName -Destination $targetPath -Force
          }

          "installer_path=$targetPath" >> $env:GITHUB_OUTPUT
          "installer_name=$targetName" >> $env:GITHUB_OUTPUT

      - name: Import signing certificate
        if: ${{ env.HAS_WINDOWS_SIGNING_CERTIFICATE == 'true' }}
        id: signing_cert
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD) {
            throw "WINDOWS_SIGNING_CERTIFICATE_PASSWORD is required when WINDOWS_SIGNING_CERTIFICATE_BASE64 is set."
          }

          $certPath = Join-Path $env:RUNNER_TEMP "inputforge-signing.pfx"
          [System.IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64))
          "certificate_path=$certPath" >> $env:GITHUB_OUTPUT

      - name: Sign installer
        if: ${{ env.HAS_WINDOWS_SIGNING_CERTIFICATE == 'true' }}
        shell: pwsh
        env:
          INSTALLER_PATH: ${{ steps.release_installer.outputs.installer_path }}
          CERTIFICATE_PATH: ${{ steps.signing_cert.outputs.certificate_path }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          WINDOWS_SIGNING_TIMESTAMP_URL: ${{ secrets.WINDOWS_SIGNING_TIMESTAMP_URL }}
        run: |
          $timestampUrl = if ($env:WINDOWS_SIGNING_TIMESTAMP_URL) {
            $env:WINDOWS_SIGNING_TIMESTAMP_URL
          } else {
            "http://timestamp.digicert.com"
          }

          $signtool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -File -Filter signtool.exe |
            Where-Object { $_.FullName -match "\\x64\\signtool.exe$" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $signtool) {
            throw "signtool.exe was not found in the Windows Kits installation."
          }

          & $signtool.FullName sign /fd SHA256 /f "$env:CERTIFICATE_PATH" /p "$env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD" /tr "$timestampUrl" /td SHA256 "$env:INSTALLER_PATH"

      - name: Generate checksum
        id: checksum
        shell: pwsh
        env:
          INSTALLER_PATH: ${{ steps.release_installer.outputs.installer_path }}
          INSTALLER_NAME: ${{ steps.release_installer.outputs.installer_name }}
        run: |
          $checksumPath = "$env:INSTALLER_PATH.sha256"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath "$env:INSTALLER_PATH").Hash.ToLowerInvariant()
          "$hash  $env:INSTALLER_NAME" | Set-Content -LiteralPath "$checksumPath" -Encoding ascii -NoNewline
          "checksum_path=$checksumPath" >> $env:GITHUB_OUTPUT

      - name: Upload release artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: inputforge-${{ matrix.platform }}-${{ needs.test.outputs.release_version }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ steps.release_installer.outputs.installer_path }}
            ${{ steps.checksum.outputs.checksum_path }}

  publish:
    name: Publish GitHub Release
    needs:
      - test
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3.0.0
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: ${{ needs.test.outputs.is_prerelease == 'true' }}
          files: release-assets/**/*
