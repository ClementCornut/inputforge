[package]
name = "inputforge-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
evdev-input = ["dep:evdev", "dep:udev", "dep:nix"]
sdl3-input = ["dep:sdl3"]
vjoy-output = ["dep:vjoy"]
win32-io = ["dep:windows"]
test-util = []

[dependencies]
serde = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
uuid = { workspace = true }
dirs = { workspace = true }
tempfile = { workspace = true }
unicode-segmentation = { workspace = true }

blake3 = { workspace = true }
chrono = { workspace = true }
ulid = { workspace = true }
indexmap = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
opener = { workspace = true }
inputforge-autostart = { workspace = true }

# Hardware I/O (optional, behind feature gates)
sdl3 = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
vjoy = { workspace = true, optional = true }
windows = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = { workspace = true, optional = true }
udev = { workspace = true, optional = true }
nix = { workspace = true, optional = true, features = ["poll"] }

[dev-dependencies]
serde_json = { workspace = true }
inputforge-autostart = { workspace = true, features = ["mock"] }

[lints]
workspace = true

[[example]]
name = "linux-capture"
path = "examples/linux_capture/main.rs"
required-features = ["evdev-input"]
