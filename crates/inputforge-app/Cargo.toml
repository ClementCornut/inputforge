[package]
name = "inputforge-app"
autobins = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "inputforge"
path = "src/main.rs"

[dependencies]
arboard = { workspace = true }
rfd = { workspace = true }
inputforge-gui-dx    = { workspace = true }
inputforge-autostart = { workspace = true }
parking_lot          = { workspace = true }
tracing              = { workspace = true }
inputforge-core   = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow             = { workspace = true }
tracing-subscriber = { workspace = true }
mimalloc           = { workspace = true }
clap               = { workspace = true }
tray-icon          = { workspace = true }
muda = { workspace = true }
uuid = { workspace = true }
dioxus = { workspace = true, features = ["desktop"] }
tokio = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
inputforge-core = {
    workspace = true,
    features = ["sdl3-input", "vjoy-output", "win32-io"],
}
windows               = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { workspace = true, features = ["wayland-data-control"] }
tray-icon = { workspace = true, features = ["ksni"] }
zbus = { workspace = true }
glib = { workspace = true }
inputforge-core = { workspace = true, features = ["evdev-input", "uinput-output"] }

[dev-dependencies]
inputforge-core = { workspace = true, features = ["test-util"] }
inputforge-autostart = { workspace = true, features = ["mock"] }
tokio = { workspace = true, features = ["test-util"] }
ulid = { workspace = true }
tempfile = { workspace = true }
muda = { workspace = true, features = ["snapshot"] }

[lints]
workspace = true
